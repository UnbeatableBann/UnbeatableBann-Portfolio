name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Continuous Integration (Lint, Format & Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb', '**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Lint Codebase
        run: bun run lint

      - name: Verify Formatting
        run: bun run format -- --check || echo "Format check failed, but build will proceed"

      - name: Build Production Bundle
        run: bun run build
        env:
          GITHUB_USERNAME: ${{ secrets.GITHUB_USERNAME }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MEDIUM_USERNAME: ${{ secrets.MEDIUM_USERNAME }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

  deploy-vercel:
    name: Continuous Deployment (Vercel)
    needs: ci
    runs-on: ubuntu-latest
    # DISABLED: Set to 'false' to skip Vercel deployment while keeping the configuration intact.
    # To re-enable, use: if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    if: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Config
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Project Artifacts (Vercel)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel (Production)
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  deploy-cloudflare:
    name: Continuous Deployment (Cloudflare Pages)
    needs: ci
    runs-on: ubuntu-latest
    # DISABLED: Set to 'false' to skip Cloudflare deployment while keeping the configuration intact.
    # To re-enable, use: if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    if: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb', '**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build for Cloudflare
        run: bun run build
        env:
          CF_PAGES: 1
          GITHUB_USERNAME: ${{ secrets.GITHUB_USERNAME }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MEDIUM_USERNAME: ${{ secrets.MEDIUM_USERNAME }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=shadabjamadar --commit-dirty=true
